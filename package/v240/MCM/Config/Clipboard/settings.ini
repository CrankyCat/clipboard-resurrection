[Dialogs]
; Optional compatibility; only affects an installed Condition Boy/Girl overlay during input.
bHideConditionBoyDuringInput=1
bEnableActionFinishedDialogs=1
bEnableManualMethodDialog=0
iWorkshopModeOnAction=1

[Balance]
bEnableComponentCost=0
bDisableHavokOnImportedObjects=1

[Import]
bUseThrottling=1

[Selection]
iInitialSelectionMethod=3
iEffectIndex=0
bEnableAnimalSelection=0
bAllowNormallyFilteredObjectsToBeSelectedAndExported=0
bAllowAllObjectsToBeImported=0
fWideSelectionMaxDistance=5000.0
aPluginBlackList=SimSettlements.esm,Seasons.esm
aMasterPluginBlackList=SimSettlements.esm
aFormBlackList=SimSettlements.esm#103182

[OptionalFiltering]
; Selection/export only. Empty values disable individual rules.
; IDs after # are decimal local FormIDs; no optional ESP masters are required.
aReferenceKeywordBlackList=SS2.esm#84480,Fallout4.esm#2391846
; Exact roots plus active plugins with those direct masters; SCOL bases only.
aCollectionPluginFamilyBlackList=SS2.esm
; A supported live parent script AND its current outgoing slot link are required.
aChildParentScripts=ukAutoBeds:ukTablePlaceAtMe,ukAutoBeds:ukMultiPlaceAtMe
aChildLinkKeywordBlackList=ukAutoBeds.esp#37038,ukAutoBeds.esp#37039,ukAutoBeds.esp#247965,ukAutoBeds.esp#300450,ukAutoBeds.esp#300465,ukAutoBeds.esp#300472,ukAutoBeds.esp#300477,ukAutoBeds.esp#335602,ukAutoBeds.esp#510781,ukAutoBeds.esp#528283,ukAutoBeds.esp#563313,ukAutoBeds.esp#615877,ukAutoBeds.esp#615878,ukAutoBeds.esp#615879,ukAutoBeds.esp#615880,ukAutoBeds.esp#615881,ukAutoBeds.esp#615882,ukAutoBeds.esp#615884,ukAutoBeds.esp#615885,ukAutoBeds.esp#615886,ukAutoBeds.esp#615887,ukAutoBeds.esp#931059,ukAutoBeds.esp#1421151,ukAutoBeds.esp#1438678,ukAutoBeds.esp#1473891,ukAutoBeds.esp#1473892,ukAutoBeds.esp#1473893,ukAutoBeds.esp#1473894,ukAutoBeds.esp#1473895,ukAutoBeds.esp#1473896,ukAutoBeds.esp#1473897,ukAutoBeds.esp#1473898,ukAutoBeds.esp#1473899,ukAutoBeds.esp#1473900,ukAutoBeds.esp#1508942,ukAutoBeds.esp#1508943,ukAutoBeds.esp#1508944,ukAutoBeds.esp#1543978,ukAutoBeds.esp#1543979,ukAutoBeds.esp#1543980,ukAutoBeds.esp#1543981,ukAutoBeds.esp#1543983

[Debug]
bDisplayImportWarnings=1
bEnableLogging=0

; Optional wait snapshots require Debug.bEnableLogging=1 and cover any pattern.
; Callback admission settings below also apply when logging is disabled.
[ImportDiagnostics]
bWorkshopWaitSnapshots=1
; One additional 5-second snapshot per job; requires waits On, Throttling On, single/explicit limit and 0 ms spacing.
bWorkshopEarlyWaitSnapshot=1
; Contention experiment: one accepted direct callback while Use Throttling is On.
bSingleWorkshopCallback=0
; Bounded spacing comparison: 0 or 100 ms; requires Throttling On and single callback.
iWorkshopCallbackSpacingMs=0
; Explicit maximum outstanding callbacks with Throttling On; 0 = all rows. Overrides the legacy single switch.
iWorkshopCallbackLimit=10
; Close admission at the limit; resume only at this many pending calls. 0 = fully drain, not unlimited admission.
iWorkshopCallbackResumeAt=5

; Functional power ordering; retained in this section for existing configuration compatibility.
; Applies to every pattern. Defaults to 1 when absent; explicit 0 selects combined power.
[ImportStateTracking]
bSplitPowerPasses=1
